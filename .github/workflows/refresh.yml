name: Refresh data

on:
  schedule:
    - cron: "17 3 5 * *"   # 5th of each month, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Download reports, Excel versions and long-run series (fails if the city changes a file name)
        run: python scripts/download.py --all
      - name: Extract and validate (fails on any total mismatch)
        run: python scripts/extract.py
      - name: Long-run series since 1982 (fails if it disagrees with the reports)
        run: python scripts/longrun.py
      - name: Cross-check against the Excel versions (fails on any missing value)
        run: python scripts/crosscheck_excel.py
      - name: Population files (reads the city's index pages; fails if a page changes)
        run: python scripts/population_download.py
      - name: Population extract and checks (fails on any mismatch)
        run: python scripts/population_extract.py
      - name: Mobility files (yearbook, transport bureau, ministry)
        run: python scripts/mobility_download.py
      - name: Mobility extract and checks (fails if a table can't be read)
        run: python scripts/mobility_extract.py
      - name: Land prices and ward boundaries (国土数値情報)
        run: python scripts/landprice_download.py
      - name: Land-price extract and checks (fails on any mismatch)
        run: python scripts/landprice_extract.py
      - name: Disaster extract and checks (GSI files are downloaded by hand; this re-checks them)
        run: python scripts/disaster_extract.py
      - name: Commit if the data changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/processed data/raw/population data/raw/mobility
          git diff --cached --quiet || git commit -m "data: monthly refresh"
          git push
